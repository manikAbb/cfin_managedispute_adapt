# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: customer-app-variant3
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
customConfiguration:
  adp:
    support:
      id: '@sap/generator-fiori'
      version: 1.34.0
      toolsId: d416a192-07b5-4578-bef1-0ffa801c83ea
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: CF2_100_Manik
          url: http://gl-cf2-aem-d.abb.com:443
          client: '100'
        app:
          package: ZCFIN_FIORI
          transport: CF2K964193
        exclude:
          - /test/
          - /localService/
        lrep: apps/fin.fscm.dm.disputes.manage/appVariants/customer.ZFSCM_DISPUTE_M_ADP/
